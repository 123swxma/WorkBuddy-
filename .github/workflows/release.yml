name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 v1.9.1）'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Read version from build.gradle.kts
        id: ver
        run: |
          NAME=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          CODE=$(sed -n 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "resolved versionName=$NAME versionCode=$CODE"

      # 有 Secrets 就用正式签名；没配就退回 debug 签名，CI 不会因为缺密钥而失败
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > wbuddy-release.jks
            {
              echo "storeFile=wbuddy-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "已写入正式签名配置"
          else
            echo "未配置签名 Secrets，本次使用 debug 签名"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/WorkBuddyProxy-${{ steps.ver.outputs.name }}.apk"
          ls -lh out/

      - name: Checksum
        run: |
          cd out
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: WorkBuddyProxy ${{ steps.ver.outputs.name }}
          draft: false
          generate_release_notes: true
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          body: |
            安装包：`WorkBuddyProxy-${{ steps.ver.outputs.name }}.apk`（debug 签名，可直接侧载）

            - versionName: `${{ steps.ver.outputs.name }}`
            - versionCode: `${{ steps.ver.outputs.code }}`
            - 校验：`sha256sum -c SHA256SUMS.txt`

            完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
