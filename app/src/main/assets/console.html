<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1418">
<title>WorkBuddy 反代控制台</title>
<style>
  :root{
    --bg:#0E1418; --card:#17212B; --card2:#1F2C38; --line:#24323E;
    --brand:#0DBD8B; --text:#E6EDF3; --dim:#8B9BA8; --danger:#E5534B; --warn:#D29922;
    --header-bg:rgba(14,20,24,.94); --nav-bg:rgba(23,33,43,.96);
  }
  /* 浅色：App 设置里选了浅色外观时，URL 带 ?theme=light 触发 */
  body.light{
    --bg:#F4F6F8; --card:#FFFFFF; --card2:#EDF1F5; --line:#D8E0E8;
    --brand:#0A8F69; --text:#16202A; --dim:#5B6B7A; --danger:#C93B33; --warn:#B7791F;
    --header-bg:rgba(244,246,248,.94); --nav-bg:rgba(255,255,255,.96);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:0 0 76px;
  }
  header{
    position:sticky;top:0;z-index:10;background:rgba(14,20,24,.94);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:14px 16px;display:flex;align-items:center;gap:10px;
  }
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--brand);box-shadow:0 0 10px rgba(13,189,139,.7)}
  .dot.err{background:var(--danger)}
  .spacer{flex:1}
  .badge{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  main{padding:16px}
  section{display:none}
  section.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(36,50,62,.7)}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--dim);font-size:12.5px;min-width:96px}
  .row .v{flex:1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  button{
    font:inherit;border:none;border-radius:12px;padding:11px 14px;font-weight:600;
    background:var(--card2);color:var(--text);border:1px solid var(--line);
  }
  button:active{transform:scale(.985)}
  button.primary{background:var(--brand);color:#04211A;border-color:transparent}
  button.ghost{background:transparent}
  button.danger{color:var(--danger)}
  button.sm{padding:7px 11px;font-size:12px;border-radius:10px;font-weight:500}
  button:disabled{opacity:.45}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btns button{flex:1;min-width:120px}
  .acct{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px}
  .acct .meta{flex:1;min-width:0}
  .acct .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct .st{font-size:11.5px;color:var(--dim);margin-top:2px}
  .acct .st.ok{color:var(--brand)} .acct .st.warn{color:var(--warn)} .acct .st.bad{color:var(--danger)}
  .acct-wrap{margin-bottom:9px}
  .acct-wrap .acct{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
  .acct-detail{display:none;background:var(--card);border:1px solid var(--line);border-top:none;
    border-radius:0 0 14px 14px;padding:4px 14px 12px}
  .acct-detail .drow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px}
  .acct-detail .drow .dl{color:var(--dim);flex:none;width:88px}
  .acct-detail .drow .dv{flex:1;word-break:break-all}
  .acct-detail .bar{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin:2px 0 8px}
  .acct-detail .bar > i{display:block;height:100%;background:var(--brand)}
  .pill{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
    background:var(--nav-bg);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1;background:none;border:none;color:var(--dim);font-size:11px;font-weight:500;
    padding:8px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  nav button.on{color:var(--brand)}
  nav button .ic{font-size:16px;line-height:1}
  .log{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;padding:7px 0;border-bottom:1px solid rgba(36,50,62,.6);display:flex;gap:8px}
  .log .t{color:var(--dim);flex:none}
  .log .m{flex:1;word-break:break-all}
  .log.warn .m{color:var(--warn)} .log.error .m{color:var(--danger)}
  label.field{display:block;margin-bottom:12px}
  label.field .lbl{font-size:12px;color:var(--dim);display:block;margin-bottom:5px}
  input,select{
    width:100%;font:inherit;background:var(--card2);color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  }
  input[type=checkbox]{width:auto;transform:scale(1.25);margin-right:8px}
  .switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(36,50,62,.7)}
  .switch:last-child{border-bottom:none}
  .empty{color:var(--dim);text-align:center;padding:28px 0;font-size:13px}
  .toast{
    position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);
    background:var(--card2);border:1px solid var(--line);color:var(--text);
    padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.22s;pointer-events:none;z-index:50;
    max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .linkbox{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:11px;font-size:12px;word-break:break-all;color:var(--brand)}
  .hint{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.5}
</style>
</head>
<body>

<header>
  <span class="dot" id="hdot"></span>
  <h1>WorkBuddy 反代</h1>
  <span class="spacer"></span>
  <span class="badge" id="hbadge">连接中…</span>
</header>

<main>
  <!-- 概览 -->
  <section id="tab-overview" class="active">
    <div class="card">
      <h2>服务状态</h2>
      <div class="row"><span class="k">运行</span><span class="v" id="s-run">—</span></div>
      <div class="row"><span class="k">端口</span><span class="v" id="s-port">—</span></div>
      <div class="row"><span class="k">账号</span><span class="v" id="s-accounts">—</span></div>
      <div class="row"><span class="k">局域网</span><span class="v" id="s-lan">—</span></div>
      <div class="btns">
        <button class="primary" id="btn-test">链路测试</button>
        <button id="btn-refresh">刷新</button>
      </div>
    </div>

    <div class="card">
      <h2>接入信息</h2>
      <div class="row"><span class="k">本机 Base</span><span class="v" id="s-base">—</span></div>
      <div class="row"><span class="k">局域网 Base</span><span class="v" id="s-lanbase">—</span></div>
      <div class="row"><span class="k">API Key</span><span class="v" id="s-key">—</span></div>
      <div class="btns">
        <button id="btn-copy-base">复制 Base</button>
        <button id="btn-copy-key">复制 Key</button>
      </div>
      <div class="hint">OpenAI 客户端填 Base + Key；Claude Code 的 ANTHROPIC_BASE_URL 末尾不要带 /v1。</div>
    </div>

    <div class="card">
      <h2>可用模型</h2>
      <div id="models" class="hint">加载中…</div>
    </div>
  </section>

  <!-- 账号 -->
  <section id="tab-accounts">
    <div class="card">
      <h2>添加账号</h2>
      <div class="btns" style="margin-top:0">
        <button class="primary" onclick="login('intl')">国际版登录</button>
        <button onclick="login('cn')">国内版登录</button>
      </div>
      <div class="btns">
        <button class="ghost sm" onclick="manualToken()">手动粘贴 Token</button>
      </div>
      <div id="loginBox" style="display:none;margin-top:12px">
        <div class="linkbox" id="loginUrl"></div>
        <div class="hint" id="loginStatus"></div>
        <div class="btns">
          <button class="primary sm" id="btn-goto-login">去登录页</button>
          <button class="ghost sm" onclick="closeLogin()">收起</button>
        </div>
      </div>
    </div>
    <div id="accounts"></div>
  </section>

  <!-- 日志 -->
  <section id="tab-logs">
    <div class="card">
      <h2>最近请求</h2>
      <div id="logs" class="hint">加载中…</div>
      <div class="btns"><button class="ghost sm" onclick="loadLogs()">刷新</button></div>
    </div>
  </section>

  <!-- 设置 -->
  <section id="tab-settings">
    <div class="card">
      <h2>网络</h2>
      <label class="field">
        <span class="lbl">监听端口（修改需重启服务）</span>
        <input id="f-port" type="number" inputmode="numeric" min="1024" max="65535">
      </label>
      <div class="switch"><span>允许局域网访问</span><input id="f-lan" type="checkbox"></div>
    </div>

    <div class="card">
      <h2>上游</h2>
      <label class="field">
        <span class="lbl">System 注入策略</span>
        <select id="f-prompt">
          <option value="auto">auto — 无 system 时补默认</option>
          <option value="keep">keep — 原样透传</option>
          <option value="replace">replace — 统一覆盖</option>
        </select>
      </label>
      <label class="field">
        <span class="lbl">国内版对话入口</span>
        <select id="f-cnbase">
          <option value="https://copilot.tencent.com">copilot.tencent.com（国内）</option>
          <option value="https://www.workbuddy.cn">www.workbuddy.cn（海外可用）</option>
        </select>
      </label>
      <label class="field">
        <span class="lbl">国际版上游基址（默认官方；可填自建中转）</span>
        <input id="f-intlbase" type="text" placeholder="https://www.workbuddy.ai" autocapitalize="off" autocorrect="off">
      </label>
      <label class="field">
        <span class="lbl">读超时（秒）</span>
        <input id="f-timeout" type="number" inputmode="numeric" min="30" max="1800">
      </label>
      <label class="field">
        <span class="lbl">失败换号次数</span>
        <input id="f-retries" type="number" inputmode="numeric" min="0" max="5">
      </label>
      <div class="switch"><span>清理空 delta 字段</span><input id="f-clean" type="checkbox"></div>
      <div class="btns"><button class="primary" onclick="saveConfig()">保存设置</button></div>
    </div>

    <div class="card">
      <h2>API Key</h2>
      <div id="keyList"><div class="hint">加载中…</div></div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
        <label class="field">
          <span class="lbl">新建 Key 的名称</span>
          <input id="keyLabel" placeholder="例如：电脑端 / 手机 Claude Code">
        </label>
        <label class="field">
          <span class="lbl">绑定的区域</span>
          <select id="keyRealm">
            <option value="intl">仅国际版（workbuddy.ai 的账号）</option>
            <option value="cn">仅国内版（codebuddy.cn 的账号）</option>
            <option value="any" selected>不限制（按模型名自动选）</option>
          </select>
        </label>
        <div class="btns"><button class="primary" id="btnSaveKey" onclick="createKey()">新建 API Key</button></div>
        <div class="hint">绑了区域后，这把 Key 只会派该区域的账号；同一模型名在两边都有时，靠 Key 决定走哪边。</div>
      </div>
    </div>
  </section>
</main>

<nav>
  <button class="on" data-tab="overview"><span class="ic">◎</span>概览</button>
  <button data-tab="accounts"><span class="ic">☰</span>账号</button>
  <button data-tab="logs"><span class="ic">≡</span>日志</button>
  <button data-tab="settings"><span class="ic">⚙</span>设置</button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // 外观：App 设置里选浅色时会在 URL 上带 theme=light
  if (new URLSearchParams(location.search).get("theme") === "light") {
    document.body.classList.add("light");
  }
  var KEY = new URLSearchParams(location.search).get("key") || localStorage.getItem("wb_key") || "";
  if (KEY) localStorage.setItem("wb_key", KEY);

  function withKey(path){
    if (!KEY) return path;
    return path + (path.indexOf("?") >= 0 ? "&" : "?") + "key=" + encodeURIComponent(KEY);
  }
  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({"Content-Type":"application/json"}, opts.headers || {});
    return fetch(withKey(path), opts).then(function(r){
      if (r.status === 403) throw new Error("需要面板 Key（局域网访问）");
      return r.json().catch(function(){ return {}; });
    });
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function copy(text, label){
    if (!text) return;
    var done = function(){ toast(label + " 已复制"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function(){ fallback(); });
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch(e){ toast("复制失败"); }
      document.body.removeChild(ta);
    }
  }

  var state = { status: null };

  function loadStatus(){
    return api("/api/status").then(function(s){
      state.status = s;
      var dot = document.getElementById("hdot");
      dot.className = "dot" + (s.running ? " on" : "");
      document.getElementById("hbadge").textContent = s.running ? ("运行中 :" + s.port) : "已停止";
      document.getElementById("s-run").textContent = s.running ? "运行中" : "已停止";
      document.getElementById("s-port").textContent = s.port;
      document.getElementById("s-accounts").textContent = (s.accounts || 0) + " 个可用 / " + (s.accountCount || 0) + " 个";
      document.getElementById("s-lan").textContent = s.allowLan ? "已开启" : "仅本机";
      document.getElementById("s-base").textContent = s.baseUrl;
      document.getElementById("s-lanbase").textContent = s.lanUrl || "—（无局域网地址）";
      document.getElementById("s-key").textContent = s.apiKey;
      var models = (s.models || []).map(function(m){ return '<span class="pill">' + esc(m) + '</span>'; }).join(" ");
      document.getElementById("models").innerHTML = models || "—";
      fillSettings(s);
      return s;
    }).catch(function(e){
      document.getElementById("hbadge").textContent = "未连接";
      document.getElementById("hdot").className = "dot err";
      throw e;
    });
  }

  function fillSettings(s){
    var set = function(id, v){ var el = document.getElementById(id); if (el && document.activeElement !== el) { if (el.type === "checkbox") el.checked = !!v; else el.value = v; } };
    set("f-port", s.port);
    set("f-lan", s.allowLan);
    set("f-prompt", s.promptMode);
    set("f-cnbase", s.cnBase);
    set("f-intlbase", s.intlBase);
    set("f-timeout", s.readTimeoutSec);
    set("f-retries", s.maxRetries);
    set("f-clean", s.cleanChunks);
  }

  function loadAccounts(){
    return api("/api/accounts").then(function(r){
      var box = document.getElementById("accounts");
      var list = r.accounts || [];
      if (!list.length) { box.innerHTML = '<div class="empty">还没有账号，点上方按钮添加</div>'; return; }
      box.innerHTML = list.map(function(a){
        var now = Date.now();
        var cooling = a.cooldownUntil && a.cooldownUntil > now;
        var cls = "ok", txt = "可用";
        if (!a.enabled) { cls = "bad"; txt = "已禁用"; }
        else if (a.tokenExpired) { cls = "bad"; txt = "登录失效"; }
        else if (cooling) { cls = "warn"; txt = "冷却 " + Math.ceil((a.cooldownUntil - now)/1000) + "s"; }
        else if (a.lastError) { cls = "warn"; txt = a.lastError; }
        return '<div class="acct-wrap">'
          + '<div class="acct" onclick="toggleAcctDetail(this, \'' + esc(a.uid) + '\')">'
          + '<div class="meta"><div class="nm">' + esc(a.nickname || a.uid.slice(0,8)) + '</div>'
          + '<div class="st ' + cls + '">' + esc(txt) + ' · 点开看积分</div></div>'
          + '<span class="pill">' + (a.realm === "cn" ? "国内" : "国际") + '</span>'
          + '<button class="sm" onclick="event.stopPropagation();toggleAcct(\'' + esc(a.uid) + '\',' + (!a.enabled) + ')">' + (a.enabled ? "禁用" : "启用") + '</button>'
          + '<button class="sm danger" onclick="event.stopPropagation();delAcct(\'' + esc(a.uid) + '\')">删</button>'
          + '</div>'
          + '<div class="acct-detail"></div>'
          + '</div>';
      }).join("");
    });
  }

  window.toggleAcctDetail = function(head, uid){
    var wrap = head.parentNode;
    var box = wrap.querySelector(".acct-detail");
    if (!box) return;
    if (box.style.display === "block") { box.style.display = "none"; return; }
    box.style.display = "block";
    box.innerHTML = '<div class="drow"><span class="dl">积分</span><span class="dv">读取中…</span></div>';
    api("/api/accounts/" + encodeURIComponent(uid) + "/detail").then(function(d){
      box.innerHTML = renderAcctDetail(d);
    }).catch(function(e){
      box.innerHTML = '<div class="drow"><span class="dl">失败</span><span class="dv" style="color:var(--danger)">' + esc(e.message) + '</span></div>';
    });
  };

  function fmtNum(v){
    if (v == null) return "—";
    if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
    return (Math.round(v * 10) / 10).toString();
  }

  function renderAcctDetail(d){
    if (d.error) {
      return '<div class="drow"><span class="dl">获取失败</span><span class="dv" style="color:var(--danger)">' + esc(d.error) + '</span></div>';
    }
    var rows = [];
    var tier = d.paid === true ? "付费用户" : (d.paid === false ? "免费用户" : "未知");
    rows.push('<div class="drow"><span class="dl">档位</span><span class="dv">' + tier + '</span></div>');
    rows.push('<div class="drow"><span class="dl">剩余积分</span><span class="dv" style="color:var(--brand)">'
      + fmtNum(d.remain) + ' / ' + fmtNum(d.size) + '</span></div>');
    var pct = Math.max(0, Math.min(100, parseFloat(d.remainPercent) || 0));
    rows.push('<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>');

    var c = d.checkin || {};
    if (c.supported) {
      var txt = c.todayCheckedIn ? "今日已领" : "今日未领";
      if (c.streakDays > 0) txt += " · 连续 " + c.streakDays + " 天";
      if (c.todayCredit > 0) txt += " · 今日 +" + fmtNum(c.todayCredit);
      rows.push('<div class="drow"><span class="dl">Buddy 加油站</span><span class="dv" style="color:'
        + (c.todayCheckedIn ? 'var(--brand)' : 'var(--warn)') + '">' + esc(txt) + '</span></div>');
      if (!c.todayCheckedIn && c.active !== false) {
        rows.push('<div class="drow"><span class="dl"></span><span class="dv">'
          + '<button class="sm primary" onclick="doCheckin(this, \'' + esc(d.uid) + '\')">签到领积分</button>'
          + '</span></div>');
      }
    } else {
      rows.push('<div class="drow"><span class="dl">Buddy 加油站</span><span class="dv" style="color:var(--dim)">国际版无此活动</span></div>');
    }

    var pkgs = d.packages || [];
    var soon = null;
    for (var i = 0; i < pkgs.length; i++) {
      var p = pkgs[i];
      if (p.daysLeft != null && p.daysLeft >= 0 && p.remain > 0) { soon = p; break; }
    }
    if (soon) {
      rows.push('<div class="drow"><span class="dl">最近到期</span><span class="dv">'
        + esc(soon.name) + ' 剩 ' + fmtNum(soon.remain) + '（' + Math.round(soon.daysLeft) + ' 天）</span></div>');
    }
    if (pkgs.length) {
      rows.push('<div class="drow"><span class="dl">积分包</span><span class="dv">' + pkgs.length + ' 个</span></div>');
    }
    if (d.updatedAt) {
      var t = new Date(d.updatedAt);
      rows.push('<div class="drow"><span class="dl">更新于</span><span class="dv" style="color:var(--dim)">'
        + t.toLocaleTimeString() + '</span></div>');
    }
    return rows.join("");
  }

  window.doCheckin = function(btn, uid){
    btn.disabled = true;
    btn.textContent = "签到中…";
    api("/api/accounts/" + encodeURIComponent(uid) + "/checkin", {method:"POST", body:"{}"}).then(function(r){
      toast(r.message || (r.ok ? "签到成功" : "签到失败"));
      var box = btn.closest ? btn.closest(".acct-detail") : null;
      if (box) {
        api("/api/accounts/" + encodeURIComponent(uid) + "/detail").then(function(d){
          box.innerHTML = renderAcctDetail(d);
          loadStatus();
        }).catch(function(){});
      }
    }).catch(function(e){
      toast("签到失败：" + e.message);
      btn.disabled = false;
      btn.textContent = "签到领积分";
    });
  };

  window.toggleAcct = function(uid, enabled){
    api("/api/accounts/" + encodeURIComponent(uid) + "/toggle", {
      method: "POST", body: JSON.stringify({enabled: enabled})
    }).then(function(){ loadAccounts(); loadStatus(); });
  };
  window.delAcct = function(uid){
    if (!confirm("删除这个账号？")) return;
    api("/api/accounts/" + encodeURIComponent(uid), {method:"DELETE"}).then(function(){
      toast("已删除"); loadAccounts(); loadStatus();
    });
  };

  var loginState = null, loginTimer = null;

  window.login = function(realm){
    api("/api/login/start", {method:"POST", body: JSON.stringify({realm: realm})}).then(function(r){
      loginState = r.state;
      localStorage.setItem("wb_pending_login", r.state);
      document.getElementById("loginBox").style.display = "block";
      document.getElementById("loginUrl").textContent = r.authUrl;
      document.getElementById("loginStatus").textContent = "正在申请授权…";
      // 国际版：Google 拒绝在嵌入式 WebView 里完成 OAuth（会提示浏览器不安全），
      // 所以这里只给复制链接，让用户粘到系统浏览器打开。
      var goBtn = document.getElementById("btn-goto-login");
      if (realm === "intl") {
        goBtn.textContent = "复制登录链接";
        goBtn.onclick = function(){
          copy(r.authUrl, "登录链接");
          document.getElementById("loginStatus").textContent =
            "已复制。请粘贴到系统浏览器打开——Google 账号不支持应用内登录。";
        };
        document.getElementById("loginStatus").textContent =
          "国际版请用系统浏览器登录（Google 会拦截应用内 WebView）";
      } else {
        goBtn.textContent = "去登录页";
        goBtn.onclick = function(){ location.href = r.authUrl; };
      }
      closeLoginTimer();
      loginTimer = setInterval(pollLogin, 2000);
      pollLogin();
    }).catch(function(e){ toast("发起登录失败：" + e.message); });
  };

  function closeLoginTimer(){ if (loginTimer) { clearInterval(loginTimer); loginTimer = null; } }
  window.closeLogin = function(){
    document.getElementById("loginBox").style.display = "none";
    closeLoginTimer(); localStorage.removeItem("wb_pending_login");
  };

  function pollLogin(){
    if (!loginState) return;
    api("/api/login/poll?state=" + encodeURIComponent(loginState)).then(function(r){
      var el = document.getElementById("loginStatus");
      el.textContent = r.message || r.status;
      if (r.status === "ok") {
        el.textContent = "✓ " + r.message + "，正在刷新列表…";
        closeLoginTimer(); loginState = null; localStorage.removeItem("wb_pending_login");
        setTimeout(function(){ closeLogin(); loadAccounts(); loadStatus(); }, 900);
      } else if (r.status === "error" || r.status === "expired" || r.status === "unknown") {
        closeLoginTimer();
      }
    }).catch(function(){});
  }

  window.manualToken = function(){
    var token = prompt("粘贴 accessToken（JWT 字符串）");
    if (!token || token.trim().length < 20) return;
    api("/api/accounts/manual", {method:"POST", body: JSON.stringify({token: token.trim()})})
      .then(function(){ toast("已加入账号池"); loadAccounts(); loadStatus(); })
      .catch(function(e){ toast("失败：" + e.message); });
  };

  function loadLogs(){
    api("/api/logs?n=150").then(function(r){
      var box = document.getElementById("logs");
      var list = (r.logs || []).slice().reverse();
      if (!list.length) { box.innerHTML = '<div class="empty">暂无日志</div>'; return; }
      box.innerHTML = list.map(function(e){
        return '<div class="log ' + esc(e.level) + '"><span class="t">' + esc(e.time) + '</span><span class="m">' + esc(e.message) + '</span></div>';
      }).join("");
    });
  }

  window.saveConfig = function(){
    var body = {
      port: parseInt(document.getElementById("f-port").value, 10) || 8788,
      allowLan: document.getElementById("f-lan").checked,
      promptMode: document.getElementById("f-prompt").value,
      cnBase: document.getElementById("f-cnbase").value,
      intlBase: document.getElementById("f-intlbase").value || "https://www.workbuddy.ai",
      readTimeoutSec: parseInt(document.getElementById("f-timeout").value, 10) || 300,
      maxRetries: parseInt(document.getElementById("f-retries").value, 10),
      cleanChunks: document.getElementById("f-clean").checked
    };
    api("/api/config", {method:"POST", body: JSON.stringify(body)}).then(function(){
      toast("已保存" + (body.port !== (state.status && state.status.port) ? "，端口改动需重启服务" : ""));
      loadStatus();
    }).catch(function(e){ toast("保存失败：" + e.message); });
  };

  function keyRealmText(realm){
    if (realm === "cn") return "仅国内版";
    if (realm === "intl") return "仅国际版";
    return "不限制";
  }

  function loadKeys(){
    api("/api/keys").then(function(r){
      var list = r.keys || [];
      keysCache = list;
      var box = document.getElementById("keyList");
      if (!box) return;
      if (!list.length) { box.innerHTML = '<div class="hint">还没有 Key</div>'; return; }
      box.innerHTML = list.map(function(k){
        return '<div class="row" style="flex-wrap:wrap;gap:6px">'
          + '<span class="v mono" style="flex-basis:100%;font-size:11.5px">' + esc(k.key) + '</span>'
          + '<span class="k" style="min-width:0">' + esc(k.label) + ' · ' + keyRealmText(k.realm)
          + (k.enabled ? '' : ' · 已停用') + '</span>'
          + '<span class="spacer"></span>'
          + '<button class="sm" onclick="copy(this.dataset.k)" data-k="' + esc(k.key) + '">复制</button>'
          + '<button class="sm" onclick="editKey(\'' + esc(k.id) + '\')">编辑</button>'
          + '<button class="sm" onclick="toggleKey(\'' + esc(k.id) + '\',' + (!k.enabled) + ')">'
          + (k.enabled ? "停用" : "启用") + '</button>'
          + '<button class="sm danger" onclick="delKey(\'' + esc(k.id) + '\')">删</button>'
          + '</div>';
      }).join("");
    }).catch(function(){});
  }

  var keysCache = [];
  var editingKeyId = null;

  function fillKeyForm(k){
    document.getElementById("keyLabel").value = k ? k.label : "";
    document.getElementById("keyRealm").value = k ? k.realm : "any";
    var btn = document.getElementById("btnSaveKey");
    if (btn) btn.textContent = k ? "保存修改" : "新建 API Key";
    editingKeyId = k ? k.id : null;
  }

  window.editKey = function(id){
    var hit = null;
    for (var i = 0; i < keysCache.length; i++) {
      if (keysCache[i].id === id) { hit = keysCache[i]; break; }
    }
    if (!hit) return;
    fillKeyForm(hit);
    var card = document.getElementById("keyLabel");
    if (card && card.scrollIntoView) card.scrollIntoView({block:"center", behavior:"smooth"});
    toast("正在编辑：" + hit.label);
  };

  window.createKey = function(){
    var labelEl = document.getElementById("keyLabel");
    var realmEl = document.getElementById("keyRealm");
    var label = (labelEl.value || "").trim() || "新 Key";
    var realm = realmEl.value;
    var editing = editingKeyId;
    var path = editing ? ("/api/keys/" + encodeURIComponent(editing) + "/update") : "/api/keys";
    api(path, {method:"POST", body: JSON.stringify({label: label, realm: realm})}).then(function(r){
      toast(editing ? "已保存" : ("已创建：" + (r.key ? r.key.label : label)));
      fillKeyForm(null);
      loadKeys();
      loadStatus();
    }).catch(function(e){ toast("保存失败：" + e.message); });
  };

  function keyName(id){
    for (var i = 0; i < keysCache.length; i++) {
      if (keysCache[i].id === id) return keysCache[i].label;
    }
    return "这把 Key";
  }

  window.toggleKey = function(id, enabled){
    var action = enabled ? "启用" : "停用";
    var msg = action + "「" + keyName(id) + "」？";
    if (!enabled) msg += "\n\n停用后使用它的客户端会立刻收到 401；Key 本身保留，可随时再启用。";
    if (!confirm(msg)) return;
    api("/api/keys/" + encodeURIComponent(id) + "/toggle", {
      method:"POST", body: JSON.stringify({enabled: enabled})
    }).then(function(){ loadKeys(); loadStatus(); })
      .catch(function(e){ toast(e.message); });
  };

  window.delKey = function(id){
    if (!confirm("删除「" + keyName(id) + "」？\n\n删除后不可恢复，用它的客户端会立刻收到 401。")) return;
    api("/api/keys/" + encodeURIComponent(id), {method:"DELETE"}).then(function(){
      toast("已删除"); loadKeys(); loadStatus();
    }).catch(function(e){ toast(e.message); });
  };

  document.getElementById("btn-refresh").onclick = function(){ loadStatus().then(loadAccounts); };
  document.getElementById("btn-copy-base").onclick = function(){
    copy(state.status && state.status.baseUrl, "Base URL");
  };
  document.getElementById("btn-copy-key").onclick = function(){
    copy(state.status && state.status.apiKey, "API Key");
  };
  document.getElementById("btn-test").onclick = function(){
    var b = document.getElementById("btn-test");
    b.disabled = true; b.textContent = "测试中…";
    api("/api/test", {method:"POST", body:"{}"}).then(function(r){
      b.disabled = false; b.textContent = "链路测试";
      if (r.ok) toast("成功：" + r.account + " · " + (r.reply || "(空回复)"));
      else toast("失败：" + (r.message || r.raw || "未知错误"));
    }).catch(function(e){
      b.disabled = false; b.textContent = "链路测试";
      toast("失败：" + e.message);
    });
  };

  // tab 切换
  var tabs = document.querySelectorAll("nav button");
  Array.prototype.forEach.call(tabs, function(btn){
    btn.onclick = function(){
      Array.prototype.forEach.call(tabs, function(b){ b.classList.remove("on"); });
      btn.classList.add("on");
      var id = btn.getAttribute("data-tab");
      Array.prototype.forEach.call(document.querySelectorAll("section"), function(s){ s.classList.remove("active"); });
      document.getElementById("tab-" + id).classList.add("active");
      if (id === "accounts") loadAccounts();
      if (id === "logs") loadLogs();
      if (id === "settings") { loadStatus(); loadKeys(); }
      window.scrollTo(0, 0);
    };
  });

  // 首屏
  loadStatus().then(function(){ loadAccounts(); loadKeys(); }).catch(function(){ toast("无法连接到本地服务"); });

  // 恢复被授权页打断的登录轮询
  var pending = localStorage.getItem("wb_pending_login");
  if (pending) {
    loginState = pending;
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("loginUrl").textContent = "（上次发起的授权仍在等待）";
    document.getElementById("btn-goto-login").style.display = "none";
    closeLoginTimer();
    loginTimer = setInterval(pollLogin, 2000);
  }

  setInterval(function(){
    if (document.getElementById("tab-overview").classList.contains("active")) loadStatus().catch(function(){});
    if (document.getElementById("tab-logs").classList.contains("active")) loadLogs();
  }, 5000);
})();
</script>
</body>
</html>
